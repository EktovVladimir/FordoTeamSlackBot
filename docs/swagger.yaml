  auth_handler.TokenRequest:
    description: запрос на генерацию токена
    properties:
      password:
        description: '@Description Пароль'
        type: string
      username:
        description: '@Description Имя пользователя'
        type: string
    type: object
  auth_handler.TokenResponse:
    description: Модель со сгенерированным токеном
    properties:
      token:
        description: '@Description токен'
        type: string
    type: object
  code_review_handler.CodeReviewResponse:
    description: Информация о процессе код-ревью
    properties:
      id:
        description: "@Description\tУникальный ID\n\t@Example:\t\t1"
        type: integer
      pull_request_number:
        description: "@Description\tНомер Pull Request\n\t@Example:\t\t\"42\""
        type: string
      status:
        description: "@Description\tСтатус код-ревью\n\t@Example:\t\t\"approved\"\n\t@Enum\t\t\tpending,approved,rejected"
        type: string
      thread_ts:
        description: "@Description\tИдентификатор треда в Slack\n\t@Example:\t\t\"1234567890.123456\""
        type: string
    type: object
  code_review_handler.CreateCodeReviewRequest:
    description: Запрос на создание код-ревью
    properties:
      pull_request_number:
        description: "@Description\tНомер Pull Request\n\t@Example:\t\t\"42\"\n\t@Required\t\ttrue"
        type: string
      status:
        description: "@Description\tСтатус код-ревью\n\t@Example:\t\t\"pending\"\n\t@Enum\t\t\tpending,approved,rejected\n\t@Required\t\ttrue"
        enum:
        - pending
        - approved
        - rejected
        type: string
      thread_ts:
        description: "@Description\tИдентификатор треда в Slack\n\t@Example:\t\t\"1234567890.123456\"\n\t@Required\t\ttrue"
        type: string
    required:
    - pull_request_number
    - status
    - thread_ts
    type: object
  code_review_handler.UpdateCodeReviewRequest:
    description: Запрос на обновление код-ревью
    properties:
      pull_request_number:
        description: "@Description\tНомер Pull Request\n\t@Example:\t\t\"42\""
        type: string
      status:
        description: "@Description\tСтатус код-ревью\n\t@Example:\t\t\"approved\"\n\t@Enum\t\t\tpending,approved,rejected"
        enum:
        - pending
        - approved
        - rejected
        type: string
      thread_ts:
        description: "@Description\tИдентификатор треда в Slack\n\t@Example:\t\t\"1234567890.123456\""
        type: string
    type: object
  deployment_handler.CreateDeploymentRequest:
    description: Запрос на создание деплоя
    properties:
      pull_request_number:
        description: "@Description\tНомер Pull Request\n\t@Example:\t\t42\n\t@Required\t\ttrue"
        type: string
      status:
        description: "@Description\tСтатус деплоя\n\t@Example:\t\tpending\n\t@Enum\t\t\tpending,success,failed,running\n\t@Required\t\ttrue"
        enum:
        - pending
        - success
        - failed
        - running
        type: string
      thread_ts:
        description: "@Description\tИдентификатор треда в Slack\n\t@Example:\t\t1234567890.123456\n\t@Required\t\ttrue"
        type: string
      workflow_run_id:
        description: "@Description\tID Workflow Run в GitHub\n\t@Example:\t\t987654321"
        type: string
    required:
    - pull_request_number
    - status
    - thread_ts
    type: object
  deployment_handler.DeploymentResponse:
    description: Информация о процессе деплоя
    properties:
      id:
        description: "@Description\tУникальный ID деплоя\n\t@Example:\t\t1"
        type: integer
      pull_request_number:
        description: "@Description\tНомер Pull Request\n\t@Example:\t\t42"
        type: string
      status:
        description: "@Description\tСтатус деплоя\n\t@Example:\t\tsuccess\n\t@Enum\t\t\tpending,success,failed,running"
        type: string
      thread_ts:
        description: "@Description\tИдентификатор треда в Slack\n\t@Example:\t\t1234567890.123456"
        type: string
      workflow_run_id:
        description: "@Description\tID Workflow Run в GitHub\n\t@Example:\t\t987654321"
        type: string
    type: object
  deployment_handler.UpdateDeploymentRequest:
    description: Запрос на обновление деплоя
    properties:
      pull_request_number:
        description: "@Description\tНомер Pull Request\n\t@Example:\t\t42"
        type: string
      status:
        description: "@Description\tСтатус деплоя\n\t@Example:\t\tsuccess\n\t@Enum\t\t\tpending,success,failed,running"
        enum:
        - pending
        - success
        - failed
        - running
        type: string
      thread_ts:
        description: "@Description\tИдентификатор треда в Slack\n\t@Example:\t\t1234567890.123456"
        type: string
      workflow_run_id:
        description: "@Description\tID Workflow Run в GitHub\n\t@Example:\t\t987654321"
        type: string
    type: object
  settings_handler.CreateSettingRequest:
    description: Запрос на создание настройки
    properties:
      key:
        description: "@Description\tУникальный ключ настройки\n\t@Required\t\ttrue"
        minLength: 1
        type: string
      value:
        description: "@Description\tЗначение настройки\n\t@Example:\t\t10485760\n\t@Required\t\ttrue"
        minLength: 1
        type: string
    required:
    - key
    - value
    type: object
  settings_handler.SettingResponse:
    description: Настройка ключа-значение
    properties:
      id:
        description: '@Description Уникальный Id'
        type: integer
      key:
        description: '@Description Уникальный ключ настройки'
        type: string
      value:
        description: '@Description Значение настройки'
        type: string
    type: object
  settings_handler.UpdateSettingRequest:
    description: Запрос на обновление настройки
    properties:
      key:
        description: "@Description\tУникальный ключ настройки\n\t@Required\t\ttrue"
        minLength: 1
        type: string
      value:
        description: "@Description\tНовое значение настройки\n\t@Required\t\ttrue"
        minLength: 1
        type: string
    required:
    - key
    - value
    type: object
  user_handler.CreateUserRequest:
    description: Запрос на создание пользователя
    properties:
      email:
        description: '@Description Рабочий email'
        type: string
      github_name:
        description: '@Description Имя пользователя в Github'
        minLength: 2
        type: string
      slack_name:
        description: '@Description Имя пользователя Slack'
        minLength: 2
        type: string
    required:
    - email
    - slack_name
    type: object
  user_handler.UserResponse:
    description: Пользователь в системе
    properties:
      email:
        description: '@Description Рабочий email'
        type: string
      github_name:
        description: '@Description Имя пользователя в Github'
        type: string
      id:
        description: '@Description Уникальный Id'
        type: integer
      slack_name:
        description: '@Description Имя пользователя Slack'
        type: string
    type: object
